packages:
  - 'packages/*'
  - 'scripts/*'    # private-only scripts, never published

# Keep in sync with the value baked into pnpm-lock.yaml (settings.injectWorkspacePackages).
# Without this, pnpm 10's frozen install in CI fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
injectWorkspacePackages: true

ignoredBuiltDependencies:
  - unrs-resolver

onlyBuiltDependencies:
  - '@hansogj/maybe'
  - esbuild
  - '@vitest/coverage-v8'

# Patch transitive vulnerabilities without waiting on upstream chains.
# All entries below target open GHSA advisories on dev-time transitives.
# Prefer same-major patches (safe); skip cross-major forces where the
# exploit surface is nil (parsing our own YAML/build files, not attacker input).
overrides:
  # flatted <3.4.2: Prototype Pollution + DoS in parse().
  # Via: eslint 10 -> file-entry-cache 8 -> flat-cache 4.0.1.
  flatted: '^3.4.2'
  # brace-expansion 1.x <1.1.13: zero-step sequence hangs process.
  # brace-expansion 5.x <5.0.6: numeric range defeats `max` DoS guard.
  # Both come via eslint's minimatch chain. Each major is pinned to its latest
  # patched release (raised in the pnpm 12.9.1 dependency update).
  'brace-expansion@<2': '^1.1.16'
  'brace-expansion@>=2 <5': '^2.1.3'
  'brace-expansion@>=5': '^5.0.9'
  # picomatch 2.x <2.3.2 and 4.x <4.0.4: method injection in POSIX classes.
  # Via tsc/eslint tinyglobby chains.
  'picomatch@2': '2.3.2'
  'picomatch@4': '4.0.4'
  # js-yaml 4.x <4.3.2: quadratic DoS in merge-key handling, and the follow-up
  # advisories fixed in 4.3.0–4.3.2. Via eslint.
  # (3.x is separately advisory'd but requires cross-major upgrade — see backlog.)
  'js-yaml@4': '^4.3.2'
  # minimatch >=7 <11.0.1: ReDoS; no 10.x fix exists. Via eslint 10 ->
  # @eslint/config-array (minimatch 10). 3.x (eslint-plugin-import) is unaffected.
  'minimatch@>=7': '^11.0.1'
  # diff <4.0.4: DoS in parsePatch/applyPatch. Via ts-node -> diff.
  diff: '4.0.4'
  # Moved from package.json "pnpm.overrides" (ignored since pnpm 10) in the
  # pnpm 12.9.1 dependency update; they were never applied until now.
  postcss: '^8.5.18'
  esbuild: '^0.28.1'

allowBuilds:
  esbuild: true
  msw: true

# pnpm's supply-chain policy blocks versions younger than minimumReleaseAge.
# Our own freshly published packages are exempt so dependents can use them right away.
minimumReleaseAgeExclude:
  - '@hansogj/discogs-item-lookup@1.5.0'
