name: test & build

on:
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # metaflac and id3v2: the CI tag tests in packages/music-utils/ci write and read real tags
      - name: Install tag tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flac id3v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run precommit (workspace, topological)
        run: pnpm run precommit
